name: android-apk

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag to upload APKs to (e.g. v0.4.0). Leave empty for artifact-only build.'
        required: false
        type: string
      build_mode:
        description: 'Android build mode'
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      upload_to_release:
        description: 'Upload generated APKs to GitHub release when a tag is available'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          tag="${{ github.event.inputs.release_tag }}"
          if [ -n "$tag" ]; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Sync app version from release tag
        if: ${{ steps.release_tag.outputs.tag != '' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          release_version="${RELEASE_TAG#v}"
          if [ -z "$release_version" ]; then
            echo "::error::Failed to resolve release version from tag: $RELEASE_TAG"
            exit 1
          fi

          RELEASE_VERSION="$release_version" node - <<'NODE'
          const fs = require('node:fs')
          const version = process.env.RELEASE_VERSION
          if (!version) {
            throw new Error('RELEASE_VERSION is missing')
          }

          const tauriPath = 'src-tauri/tauri.conf.json'
          const tauriConfig = JSON.parse(fs.readFileSync(tauriPath, 'utf8'))
          tauriConfig.version = version
          fs.writeFileSync(tauriPath, `${JSON.stringify(tauriConfig, null, 2)}\n`)

          const cargoPath = 'src-tauri/Cargo.toml'
          const cargo = fs.readFileSync(cargoPath, 'utf8')
          const updated = cargo.replace(/^version\s*=\s*".*"$/m, `version = "${version}"`)
          if (cargo === updated) {
            throw new Error('Failed to update version in src-tauri/Cargo.toml')
          }
          fs.writeFileSync(cargoPath, updated)
          NODE

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android Rust targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Initialize Android target
        run: npm run tauri -- android init --ci --skip-targets-install

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build APK
        shell: bash
        run: |
          mode="debug"
          targets="aarch64"
          if [ "${{ github.event.inputs.build_mode }}" = "release" ]; then
            mode="release"
            targets="aarch64 x86_64"
          fi

          if [ "$mode" = "release" ]; then
            npm run tauri -- android build --ci --apk --target $targets
          else
            npm run tauri -- android build --ci --apk --debug --target $targets
          fi

      - name: Collect APK paths
        id: apk_paths
        shell: bash
        run: |
          release_tag="${{ steps.release_tag.outputs.tag }}"
          release_version="dev"
          if [ -n "$release_tag" ]; then
            release_version="${release_tag#v}"
          fi

          mapfile -t apk_files < <(find src-tauri/gen/android -type f -name '*.apk' | sort)
          if [ "${#apk_files[@]}" -eq 0 ]; then
            echo "::error::No APK files found under src-tauri/gen/android"
            exit 1
          fi

          mkdir -p /tmp/dailytrack-apk-upload
          : > /tmp/apk-upload-files.txt
          for file in "${apk_files[@]}"; do
            base_name="$(basename "$file")"
            variant="${base_name#app-}"
            variant="${variant%.apk}"
            named_apk="/tmp/dailytrack-apk-upload/dailytrack_${release_version}_android_${variant}.apk"
            cp "$file" "$named_apk"
            echo "$named_apk" >> /tmp/apk-upload-files.txt
          done

          echo "count=${#apk_files[@]}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dailytrack-android-apk
          path: |
            /tmp/dailytrack-apk-upload/*.apk
          if-no-files-found: error

      - name: Upload APKs to GitHub release
        if: ${{ steps.release_tag.outputs.tag != '' && github.event.inputs.upload_to_release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        shell: bash
        run: |
          while IFS= read -r file; do
            gh release upload "$RELEASE_TAG" "$file" --clobber
          done < /tmp/apk-upload-files.txt

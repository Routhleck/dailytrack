name: android-apk

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag to upload APKs to (e.g. v0.4.0). Leave empty for artifact-only build.'
        required: false
        type: string
      build_mode:
        description: 'Android build mode'
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      upload_to_release:
        description: 'Upload generated APKs to GitHub release when a tag is available'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            tag="${{ github.event.inputs.release_tag }}"
            if [ -n "$tag" ]; then
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
            else
              echo "tag=" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android Rust targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Initialize Android target
        run: npm run tauri -- android init --ci --skip-targets-install

      - name: Build APK
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.build_mode }}" = "release" ]; then
            npm run tauri -- android build --ci --apk --target aarch64 x86_64
          elif [ "${{ github.event_name }}" = "push" ]; then
            npm run tauri -- android build --ci --apk --debug --target aarch64 x86_64
          else
            npm run tauri -- android build --ci --apk --debug --target aarch64 x86_64
          fi

      - name: Collect APK paths
        id: apk_paths
        shell: bash
        run: |
          mapfile -t apk_files < <(find src-tauri/gen/android -type f -name '*.apk' | sort)
          if [ "${#apk_files[@]}" -eq 0 ]; then
            echo "::error::No APK files found under src-tauri/gen/android"
            exit 1
          fi
          printf '%s\n' "${apk_files[@]}" > /tmp/apk-files.txt
          echo "count=${#apk_files[@]}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dailytrack-android-apk
          path: |
            src-tauri/gen/android/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload APKs to GitHub release
        if: ${{ steps.release_tag.outputs.tag != '' && (github.event_name == 'push' || github.event.inputs.upload_to_release == 'true') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        shell: bash
        run: |
          while IFS= read -r file; do
            gh release upload "$RELEASE_TAG" "$file" --clobber
          done < /tmp/apk-files.txt

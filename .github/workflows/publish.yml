name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag, e.g. v0.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Frontend checks
        run: |
          npm run lint
          npm run test -- --run
          npm run build

      - name: Upload prebuilt dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          if-no-files-found: error

  publish-tauri:
    needs: verify-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            target: ''
            args: ''

    runs-on: ${{ matrix.platform }}
    env:
      APPLE_ID_RAW: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD_RAW: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID_RAW: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_CERTIFICATE_RAW: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD_RAW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY_RAW: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      TAURI_SIGNING_PRIVATE_KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync app version from tag
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          release_version="${RELEASE_TAG#v}"
          if [ -z "$release_version" ]; then
            echo "::error::Failed to resolve release version from tag: $RELEASE_TAG"
            exit 1
          fi

          RELEASE_VERSION="$release_version" node - <<'NODE'
          const fs = require('node:fs')
          const version = process.env.RELEASE_VERSION
          if (!version) {
            throw new Error('RELEASE_VERSION is missing')
          }

          const tauriPath = 'src-tauri/tauri.conf.json'
          const tauriConfig = JSON.parse(fs.readFileSync(tauriPath, 'utf8'))
          tauriConfig.version = version
          fs.writeFileSync(tauriPath, `${JSON.stringify(tauriConfig, null, 2)}\n`)

          const cargoPath = 'src-tauri/Cargo.toml'
          const cargo = fs.readFileSync(cargoPath, 'utf8')
          const updated = cargo.replace(/^version\s*=\s*".*"$/m, `version = "${version}"`)
          if (cargo === updated) {
            throw new Error('Failed to update version in src-tauri/Cargo.toml')
          }
          fs.writeFileSync(cargoPath, updated)
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        if: ${{ matrix.target != '' }}
        run: rustup target add ${{ matrix.target }}

      - name: Prepare optional macOS signing env
        if: ${{ matrix.platform == 'macos-latest' }}
        shell: bash
        run: |
          echo "ENABLE_MACOS_SIGNING=false" >> "$GITHUB_ENV"
          missing=()
          for key in APPLE_ID_RAW APPLE_PASSWORD_RAW APPLE_TEAM_ID_RAW APPLE_CERTIFICATE_RAW APPLE_CERTIFICATE_PASSWORD_RAW; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done

          if [ ${#missing[@]} -eq 0 ]; then
            {
              echo "APPLE_ID<<EOF"
              printf '%s\n' "$APPLE_ID_RAW"
              echo "EOF"
              echo "APPLE_PASSWORD<<EOF"
              printf '%s\n' "$APPLE_PASSWORD_RAW"
              echo "EOF"
              echo "APPLE_TEAM_ID<<EOF"
              printf '%s\n' "$APPLE_TEAM_ID_RAW"
              echo "EOF"
              echo "APPLE_CERTIFICATE<<EOF"
              printf '%s\n' "$APPLE_CERTIFICATE_RAW"
              echo "EOF"
              echo "APPLE_CERTIFICATE_PASSWORD<<EOF"
              printf '%s\n' "$APPLE_CERTIFICATE_PASSWORD_RAW"
              echo "EOF"
              echo "APPLE_SIGNING_IDENTITY<<EOF"
              printf '%s\n' "$APPLE_SIGNING_IDENTITY_RAW"
              echo "EOF"
            } >> "$GITHUB_ENV"
            echo "ENABLE_MACOS_SIGNING=true" >> "$GITHUB_ENV"
            echo "::notice::All macOS signing/notarization secrets are available."
          else
            echo "::warning::macOS signing/notarization secrets are incomplete: ${missing[*]}"
            echo "::warning::This run will continue with unsigned macOS artifacts."
          fi

      - name: Prepare updater signing env
        shell: bash
        run: |
          private_key="$TAURI_SIGNING_PRIVATE_KEY_RAW"
          private_key_password="$TAURI_SIGNING_PRIVATE_KEY_PASSWORD_RAW"

          if [ -n "$private_key" ]; then
            {
              echo "TAURI_SIGNING_PRIVATE_KEY<<EOF"
              printf '%s\n' "$private_key"
              echo "EOF"
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<EOF"
              printf '%s\n' "$private_key_password"
              echo "EOF"
            } >> "$GITHUB_ENV"
            echo "UPDATER_READY=true" >> "$GITHUB_ENV"
            echo "::notice::Updater signing key found. Updater artifacts will be generated."
          else
            echo "UPDATER_READY=false" >> "$GITHUB_ENV"
            echo "::warning::Updater key configuration missing (TAURI_SIGNING_PRIVATE_KEY)."
            echo "::warning::This run will still publish installers, but in-app auto-update metadata/signatures will be skipped."
          fi

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Download prebuilt dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Resolve tauri build args
        id: tauri_args
        shell: bash
        run: |
          args="${{ matrix.args }}"
          args="$args --config src-tauri/tauri.ci.conf.json"
          if [ "${UPDATER_READY:-false}" = "true" ]; then
            args="$args --config src-tauri/tauri.updater.conf.json"
          fi
          echo "args=${args}" >> "$GITHUB_OUTPUT"

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.release_tag.outputs.tag }}
          releaseName: dailytrack ${{ steps.release_tag.outputs.tag }}
          releaseBody: Automated release built by GitHub Actions.
          releaseDraft: false
          prerelease: ${{ contains(steps.release_tag.outputs.tag, '-') }}
          args: ${{ steps.tauri_args.outputs.args }}

      - name: Inject unsigned macOS helper into DMG
        if: ${{ matrix.platform == 'macos-latest' && env.ENABLE_MACOS_SIGNING != 'true' }}
        shell: bash
        run: |
          target_dir="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          dmg_path="$(find "$target_dir" -maxdepth 1 -type f -name '*.dmg' | head -n 1)"
          if [ -z "$dmg_path" ]; then
            echo "::error::No DMG artifact found under $target_dir"
            exit 1
          fi

          rw_base="${dmg_path%.dmg}-rw"
          patched_base="${dmg_path%.dmg}-patched"

          hdiutil convert "$dmg_path" -format UDRW -o "$rw_base"
          rw_dmg="${rw_base}.dmg"

          mount_point="$(hdiutil attach "$rw_dmg" -readwrite -noverify -noautoopen | awk '/\/Volumes\// {print substr($0, index($0, "/Volumes/")); exit}')"
          if [ -z "$mount_point" ]; then
            echo "::error::Failed to mount rw dmg $rw_dmg"
            exit 1
          fi

          cp scripts/macos/fix-dailytrack-quarantine.command "$mount_point/"
          cp scripts/macos/README.md "$mount_point/INSTALL_UNSIGNED_MAC.md"
          chmod +x "$mount_point/fix-dailytrack-quarantine.command"

          sync
          hdiutil detach "$mount_point"
          hdiutil convert "$rw_dmg" -format UDZO -imagekey zlib-level=9 -o "$patched_base"

          mv "${patched_base}.dmg" "$dmg_path"
          rm -f "$rw_dmg"

      - name: Re-upload patched unsigned macOS DMG
        if: ${{ matrix.platform == 'macos-latest' && env.ENABLE_MACOS_SIGNING != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          target_dir="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          dmg_path="$(find "$target_dir" -maxdepth 1 -type f -name '*.dmg' | head -n 1)"
          if [ -z "$dmg_path" ]; then
            echo "::error::No DMG artifact found under $target_dir for re-upload"
            exit 1
          fi

          gh release upload \
            "${{ steps.release_tag.outputs.tag }}" \
            "$dmg_path" \
            --clobber

  publish-android-apk:
    needs:
      - verify-frontend
      - publish-tauri
    runs-on: ubuntu-latest
    env:
      CI: true
      ANDROID_KEY_BASE64_RAW: ${{ secrets.ANDROID_KEY_BASE64 }}
      ANDROID_KEY_ALIAS_RAW: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD_RAW: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Sync app version from tag
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          release_version="${RELEASE_TAG#v}"
          if [ -z "$release_version" ]; then
            echo "::error::Failed to resolve release version from tag: $RELEASE_TAG"
            exit 1
          fi

          RELEASE_VERSION="$release_version" node - <<'NODE'
          const fs = require('node:fs')
          const version = process.env.RELEASE_VERSION
          if (!version) {
            throw new Error('RELEASE_VERSION is missing')
          }

          const tauriPath = 'src-tauri/tauri.conf.json'
          const tauriConfig = JSON.parse(fs.readFileSync(tauriPath, 'utf8'))
          tauriConfig.version = version
          fs.writeFileSync(tauriPath, `${JSON.stringify(tauriConfig, null, 2)}\n`)

          const cargoPath = 'src-tauri/Cargo.toml'
          const cargo = fs.readFileSync(cargoPath, 'utf8')
          const updated = cargo.replace(/^version\s*=\s*".*"$/m, `version = "${version}"`)
          if (cargo === updated) {
            throw new Error('Failed to update version in src-tauri/Cargo.toml')
          }
          fs.writeFileSync(cargoPath, updated)
          NODE

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android Rust target
        run: rustup target add aarch64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Download prebuilt dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Initialize Android target
        run: npm run tauri -- android init --ci --skip-targets-install

      - name: Apply branded Android launcher icons
        shell: bash
        run: |
          source_dir="src-tauri/icons/android"
          target_dir="src-tauri/gen/android/app/src/main/res"
          if [ ! -d "$source_dir" ]; then
            echo "::error::Missing source Android icons directory: $source_dir"
            exit 1
          fi
          if [ ! -d "$target_dir" ]; then
            echo "::error::Missing generated Android resources directory: $target_dir"
            exit 1
          fi

          cp -R "$source_dir"/. "$target_dir"/
          echo "::notice::Applied branded Android launcher icons from $source_dir"

          find "$target_dir" -type f | rg 'mipmap.*/ic_launcher(\\.png|_round\\.png|_foreground\\.png)|mipmap-anydpi-v26/ic_launcher\\.xml|values/ic_launcher_background\\.xml' | sort

      - name: Prepare optional Android signing env
        shell: bash
        run: |
          echo "ENABLE_ANDROID_SIGNING=false" >> "$GITHUB_ENV"
          missing=()
          for key in ANDROID_KEY_BASE64_RAW ANDROID_KEY_ALIAS_RAW ANDROID_KEY_PASSWORD_RAW; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done

          if [ ${#missing[@]} -eq 0 ]; then
            {
              echo "ANDROID_KEY_ALIAS<<EOF"
              printf '%s\n' "$ANDROID_KEY_ALIAS_RAW"
              echo "EOF"
              echo "ANDROID_KEY_PASSWORD<<EOF"
              printf '%s\n' "$ANDROID_KEY_PASSWORD_RAW"
              echo "EOF"
            } >> "$GITHUB_ENV"

            key_path="$RUNNER_TEMP/dailytrack-upload-keystore.jks"
            base64 --decode <<< "$ANDROID_KEY_BASE64_RAW" > "$key_path"
            chmod 600 "$key_path"
            echo "ANDROID_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
            echo "ENABLE_ANDROID_SIGNING=true" >> "$GITHUB_ENV"
            echo "::notice::Android signing key found. Release APKs will be signed."
          else
            echo "::warning::Android signing secrets are incomplete: ${missing[*]}"
            echo "::warning::This run will publish unsigned release APKs."
          fi

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build APK
        run: npm run tauri -- android build --ci --apk --target aarch64

      - name: Sign release APKs
        if: ${{ env.ENABLE_ANDROID_SIGNING == 'true' }}
        shell: bash
        run: |
          apksigner_bin="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          if [ ! -x "$apksigner_bin" ]; then
            apksigner_bin="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)"
          fi
          if [ ! -x "$apksigner_bin" ]; then
            echo "::error::apksigner not found under Android build-tools."
            exit 1
          fi

          mapfile -t unsigned_apks < <(find src-tauri/gen/android -type f -name '*-unsigned.apk' | sort)
          if [ "${#unsigned_apks[@]}" -eq 0 ]; then
            echo "::notice::No unsigned release APKs found to sign."
            exit 0
          fi

          for unsigned_apk in "${unsigned_apks[@]}"; do
            signed_apk="${unsigned_apk%-unsigned.apk}.apk"
            "$apksigner_bin" sign \
              --ks "$ANDROID_KEYSTORE_PATH" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass "pass:$ANDROID_KEY_PASSWORD" \
              --key-pass "pass:$ANDROID_KEY_PASSWORD" \
              --out "$signed_apk" \
              "$unsigned_apk"
            "$apksigner_bin" verify "$signed_apk"
            echo "::notice::Signed APK: $signed_apk"
          done

      - name: Collect APK paths
        id: apk_paths
        shell: bash
        run: |
          release_version="${{ steps.release_tag.outputs.tag }}"
          release_version="${release_version#v}"
          if [ -z "$release_version" ]; then
            echo "::error::Failed to resolve release version from tag."
            exit 1
          fi

          mapfile -t apk_files < <(find src-tauri/gen/android -type f -name '*.apk' ! -name '*-unsigned.apk' | sort)
          if [ "${#apk_files[@]}" -eq 0 ]; then
            mapfile -t apk_files < <(find src-tauri/gen/android -type f -name '*.apk' | sort)
          fi
          if [ "${#apk_files[@]}" -eq 0 ]; then
            echo "::error::No APK files found under src-tauri/gen/android"
            exit 1
          fi

          mkdir -p /tmp/dailytrack-apk-upload
          : > /tmp/apk-upload-files.txt
          for file in "${apk_files[@]}"; do
            base_name="$(basename "$file")"
            variant="${base_name#app-}"
            variant="${variant%.apk}"
            named_apk="/tmp/dailytrack-apk-upload/dailytrack_${release_version}_android_${variant}.apk"
            cp "$file" "$named_apk"
            echo "$named_apk" >> /tmp/apk-upload-files.txt
          done

          echo "count=${#apk_files[@]}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dailytrack-android-apk
          path: |
            /tmp/dailytrack-apk-upload/*.apk
          if-no-files-found: error

      - name: Upload APKs to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        shell: bash
        run: |
          while IFS= read -r file; do
            gh release upload "$RELEASE_TAG" "$file" --clobber
          done < /tmp/apk-upload-files.txt
